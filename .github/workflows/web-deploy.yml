name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version-check:
    uses: ./.github/workflows/version-checks.yml

  build:
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.should-deploy == 'true'
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore VectusLibrary
        run: dotnet restore VectusLibrary/VectusLibrary.csproj

      - name: Restore Vectus.Shared
        run: dotnet restore Vectus/Vectus.Shared/Vectus.Shared.csproj

      - name: Restore Vectus.Web
        run: dotnet restore Vectus/Vectus.Web/Vectus.Web.csproj

      - name: Create Secrets.local_secrets.cs
        run: |
          $secretsContent = @"
          namespace VectusLibrary.DataAccess;

          public static partial class Secrets
          {
              static Secrets()
              {
                  AzureConnectionString = "${{ secrets.AzureConnectionString }}";

                  AzureBlobStorageConnectionString = "${{ secrets.AzureBlobStorageConnectionString }}";
                  AzureBlobStorageAccountKey = "${{ secrets.AzureBlobStorageAccountKey }}";

                  SyncfusionLicense = "${{ secrets.SyncfusionLicense }}";

                  EmailPassword = "${{ secrets.EmailPassword }}";

                  OpenRouteServiceApiKey = "${{ secrets.OpenRouteServiceApiKey }}";
                  GoogleMapsApiKey = "${{ secrets.GoogleMapsApiKey }}";
                  GoogleMapsMapId = "${{ secrets.GoogleMapsMapId }}";

                  VamosysAPI = "${{ secrets.VamosysAPI }}";
              }
          }
          "@
          Set-Content -Path "VectusLibrary/DataAccess/Secrets.local_secrets.cs" -Value $secretsContent
        shell: pwsh

      - name: Build VectusLibrary
        run: dotnet build VectusLibrary/VectusLibrary.csproj --configuration Release --no-restore

      - name: Build Vectus.Shared
        run: dotnet build Vectus/Vectus.Shared/Vectus.Shared.csproj --configuration Release --no-restore

      - name: Build Vectus.Web
        run: dotnet build Vectus/Vectus.Web/Vectus.Web.csproj --configuration Release --no-restore

      - name: Publish Vectus.Web
        run: dotnet publish Vectus/Vectus.Web/Vectus.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.should-deploy == 'true'
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vectus'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_48CC290279E5403A886447324B474378 }}
      
      - name: Deployment Summary
        run: |
          echo "🚀 Successfully deployed Vectus version ${{ needs.version-check.outputs.current-version }} to Azure"
